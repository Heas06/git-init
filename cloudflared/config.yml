tunnel: 20754198-e745-4374-ac0e-036f65079736
# Sin "credentials-file" a proposito: cloudflared ya sabe encontrar solo
# <tunnel-id>.json junto al cert.pem que crea "cloudflared tunnel login"
# (~/.cloudflared en Mac/Linux, %USERPROFILE%\.cloudflared en Windows). Un
# "~" escrito a mano aqui se resuelve mal en Windows (pierde el punto de
# ".cloudflared"), asi que dejamos que lo resuelva el propio cloudflared.

ingress:
  # Solo lo necesario para que /salon/<slug> funcione: la pagina en si, los
  # endpoints JSON de slots/submit, y los assets/imagenes estaticos que
  # website.layout necesita (CSS/JS del frontend, logo, favicon).
  - hostname: citas.platinum-spaypeluqueria.co.uk
    path: ^/(salon(/.*)?|web/(assets|image|content|manifest\.webmanifest)(/.*)?|website/(translations|image)(/.*)?|favicon\.ico)$
    service: http://localhost:8069

  # Cualquier otra ruta en este subdominio (login, /odoo, /web/database/*,
  # etc.) no llega al origin.
  - hostname: citas.platinum-spaypeluqueria.co.uk
    service: http_status:404

  - service: http_status:404
